[[part]]
id = "thermal_cam"
name = "Thermal camera: FLIR Lepton 3.5 on a PureThermal 3 board"
system = "payload"
tier = "minimum"
qty = 1
status = "buy"
price = 291.99
mass = 25
size = "Lepton 11.8 × 12.7 × 7.2 mm on a 32 × 32 mm board, in a 40 × 30 × 22 mm printed case"
power_w = 1
box = { c = [60, -35, -126], dims = [40, 30, 22] }
buy = [
  { store = "GroupGets: Lepton 3.5", link = "https://groupgets.com/products/flir-lepton-3-5", price = "$172.00" },
  { store = "GroupGets: PureThermal 3 board", link = "https://groupgets.com/products/purethermal-3", price = "$119.99" },
]
job = "Measures the temperature of the shrub canopy, looking straight down."
why = "When chaparral shrubs run short of water they close their leaf pores and the leaves warm up compared with the air; leaf-minus-air temperature is a standard plant water-stress signal. 160 × 120 pixels, radiometric. At 60 m one pixel covers about 0.4 m, so a 1–3 m shrub spans several pixels. Its accuracy (about ±5 °C) is not enough alone, so warm and cool reference targets of known temperature sit in every flight."
instead = "FLIR Boson 320 or a Workswell WIRIS (thousands of dollars, asked by email). Same accuracy class as the Lepton without ground targets."
source = "Jackson et al. 1981 (crop water stress index); FLIR Lepton 3.5 datasheet; BEST_PRICES 10 Nov"
connects = [["payload_computer", "USB"]]
nodes = ["thermal_cam"]

[[part]]
id = "rgb_cam"
name = "Colour camera: Raspberry Pi Global Shutter Camera, 6 mm lens"
system = "payload"
tier = "minimum"
qty = 1
status = "buy"
price = 80
mass = 60
size = "38 × 38 × 28 mm body, C/CS lens on top"
power_w = 1
box = { c = [60, 30, -124], dims = [38, 38, 28] }
buy = [
  { store = "PiShop.us (camera $55, out of stock 18 Nov; lens about $25 not priced)", link = "https://www.pishop.us/product/raspberry-pi-global-shutter-camera/", price = "$55.00 + lens" },
]
job = "Photographs the plot so we can find every shrub, see how much is plant and how much is bare soil, and build its 3D shape from overlapping photos."
why = "1456 × 1088 pixels of 3.45 µm. With a 6 mm lens at 60 m one pixel is 3.5 cm and a photo covers 50 × 38 m, so 2 photos a second give 75 % overlap at 19 m/s, enough to build the canopy's 3D shape (photogrammetry). A global shutter takes the whole frame at once, so the picture does not skew at speed; 1 ms exposure smears 1.9 cm, under one pixel."
instead = "Livox Mid-360 lidar (265 g, 6.5 W): it looks sideways and up, and reaches only 40 m, so it cannot map the ground from 60 m. MAPIR Survey3W ($400) adds a near-infrared band."
source = "Raspberry Pi camera specs; Livox Mid-360 specs (read 18 Nov); our ground-resolution arithmetic"
connects = [["payload_computer", "camera ribbon (CSI)"]]
nodes = ["rgb_cam"]

