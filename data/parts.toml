why = "Water in leaves absorbs strongly near 1600 nm, so reflectance in this band drops as shrubs lose water; it is the standard leaf-water band. A camera for this band costs $5,650 or more (LUCID Triton SWIR) or rents for $2,250 a week, so for the first flights we build a two-channel sensor: one diode looks down through a 20° tube (a 21 m spot at 60 m), one looks up through a diffuser to read the sunlight. About $410 in parts plus $25 of small parts."
instead = "A SWIR camera through the companies we emailed (LUCID, Tech Imaging rental, SILIOS, Spectral Devices): images instead of spots, $2,250 a week to $30,000."
source = "Hunt and Rock 1989, Ceccato et al. 2001 (leaf water in the short-wave infrared); SPOT_SENSOR_CIRCUIT doc; prices BEST_PRICES 10 Nov"
connects = [["payload_computer", "I2C"]]
nodes = ["spot_sensor"]

