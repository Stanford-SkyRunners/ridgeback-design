[[part]]
id = "payload_computer"
name = "Payload computer: NVIDIA Jetson Orin Nano"
system = "payload"
tier = "minimum"
qty = 1
status = "reuse (Sky4)"
price = 0
mass = 176
size = "100 × 79 × 31 mm dev kit with fan"
power_w = 10
box = { c = [110, 0, -84], dims = [100, 79, 31] }
buy = [
  { store = "Raspberry Pi 5, 4 GB (Adafruit), if a lighter logger is wanted", link = "https://www.adafruit.com/product/5812", price = "$130.00" },
]
job = "Records every sensor with the time and position from the flight controller, and triggers the camera."
why = "We already own it. It takes the thermal camera over USB, the colour camera, the spot sensor and the air sensor over I2C, and reads position and time from the flight controller over a serial cable, so each reading is tagged with where the drone was. It draws 7 to 15 W."
instead = "Raspberry Pi 5 (4 GB, $130): about 130 g lighter and about 5 W less, enough for logging. Worth it if the hot-day hover margin gets tight."
source = "Jetson Orin Nano carrier board spec (DC input 9–20 V); payload_fit.py position"
connects = [["payload_power", "12 V barrel plug"], ["pixhawk", "serial cable (MAVLink): time and position"], ["thermal_cam", "USB"], ["rgb_cam", "camera ribbon (CSI)"], ["spot_sensor", "I2C"], ["air_sensor", "I2C"]]
